<!DOCTYPE html>
<html lang="en" dir="ltr" data-nav-layout="vertical" data-theme-mode="dark" data-vertical-style="detached" data-toggled="detached-open" data-card-style="style1" data-card-background="background1">
<head id="html-header">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="assets/css/jquery-ui.css" rel="stylesheet">
    <link href="assets/css/jquery-ui.structure.css" rel="stylesheet">
    <link href="assets/css/jquery-ui.theme.css" rel="stylesheet">
    <script src="assets/js/plugins/jquery.min.js"></script>
    <script src="assets/js/plugins/jquery-ui.min.js"></script>
    <script src="assets/libs/@popperjs/core/umd/popper.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/plugins/main.js"></script>
    <link id="style" href="assets/libs/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
    <link href="assets/css/icons.css" rel="stylesheet">
    <link href="assets/libs/simplebar/simplebar.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/datatables.min.css">
    <script src="assets/js/plugins/datatables.min.js"></script>
    <script src="assets/js/plugins/sevenSeg.js"></script>
    <script src="assets/js/orion.js"></script>
    <link href="assets/css/orion.css" rel="stylesheet">
</head>
<body id="orion">
<div id="loader">
    <img src="assets/images/media/loader.svg" alt="">
</div>


<div class="page">
    <header id="header" class="app-header sticky"></header>
    <aside id="sidebar" class="app-sidebar sticky sticky-pin"></aside>


    <div class="main-content app-content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl-12">
                    <div class="card custom-card">
                        <div class="top-left"></div>
                        <div class="top-right"></div>
                        <div class="bottom-left"></div>
                        <div class="bottom-right"></div>


                        <div class="card-header">
                            <div class="card-title">Kanban Board</div>
                        </div>


                        <div class="card-body">
                            <div class="modal fade" id="testLogsModal" tabindex="-1" aria-labelledby="testLogsModal" data-bs-keyboard="false" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-scrollable">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h6 class="modal-title" id="staticBackdropLabel1">Test Logs</h6>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>


                                        <div id="pipeline-steps-logs-buttons-area" class="modal-header"></div>


                                        <div id="test-logs-modal-body" class="modal-body"></div>


                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div id="blame-kanban-board-area" class="SciFi-kanban-board">
                    <div class="kanban-tasks-type in-progress">
                        <div class="pe-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="d-block fw-medium fs-15">CURRENT TEST RUNS - <span></span> <span id="number-of-current-test-runs"></span></span>
                            </div>
                        </div>


                        <div class="kanban-tasks simplebar-scrollable-y" id="inprogress-tasks">
                            <div id="in-progress-area" data-view-btn="inprogress-tasks"></div>
                        </div>
                    </div>


                    <div class="kanban-tasks-type todo">
                        <div class="pe-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="d-block fw-medium fs-15">TEST RUN FAILURES - <span></span> <span id="number-of-test-run-failures"></span></span>
                            </div>
                        </div>


                        <div class="kanban-tasks simplebar-scrollable-y" id="todo-tasks">
                            <div id="todo-area" data-view-btn="todo-tasks"></div>
                        </div>
                    </div>


                    <div class="kanban-tasks-type completed">
                        <div class="pe-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="d-block fw-medium fs-15">FIXED - <span id="number-of-fixed-test-runs"></span></span>
                            </div>
                        </div>


                        <div class="kanban-tasks simplebar-scrollable-y" id="completed-tasks">
                            <div id="completed-area" data-view-btn="completed-tasks"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="scrollToTop"><span class="arrow"><i class="ti ti-arrow-narrow-up fs-20"></i></span></div>
    <div id="responsive-overlay"></div>
    <div id="floating-alarms-container" class="floating-alarms"></div>
    <div id="floating-notification-container"></div>
</div>


<footer id="footer" class="footer mt-auto py-3 text-center"></footer>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="assets/js/plugins/sticky.js"></script>
<script src="assets/libs/simplebar/simplebar.min.js"></script>
<script src="assets/libs/apexcharts/apexcharts.min.js"></script>
<script src="assets/libs/filepond/filepond.min.js"></script>
<script src="assets/libs/filepond-plugin-image-preview/filepond-plugin-image-preview.min.js"></script>
<script src="assets/libs/filepond-plugin-image-exif-orientation/filepond-plugin-image-exif-orientation.min.js"></script>
<script src="assets/libs/filepond-plugin-file-validate-size/filepond-plugin-file-validate-size.min.js"></script>
<script src="assets/libs/filepond-plugin-file-encode/filepond-plugin-file-encode.min.js"></script>
<script src="assets/libs/filepond-plugin-image-edit/filepond-plugin-image-edit.min.js"></script>
<script src="assets/libs/filepond-plugin-file-validate-type/filepond-plugin-file-validate-type.min.js"></script>
<script src="assets/libs/filepond-plugin-file-validate-type/filepond-plugin-file-validate-type.min.js"></script>
<script src="assets/libs/filepond-plugin-image-crop/filepond-plugin-image-crop.min.js"></script>
<script src="assets/libs/filepond-plugin-image-resize/filepond-plugin-image-resize.min.js"></script>
<script src="assets/libs/filepond-plugin-image-transform/filepond-plugin-image-transform.min.js"></script>
<script src="assets/libs/flatpickr/flatpickr.min.js"></script>
<script src="assets/libs/dragula/dragula.min.js"></script>
<script src="assets/js/plugins/custom.js"></script>
<script src="assets/js/header/header.js"></script>
<script src="assets/js/sidebar/sidebar.js"></script>
<script src="assets/js/kanbanBoard/kanbanBoard.js"></script>
</body>
</html>
